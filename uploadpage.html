<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Classification</title>
    <link rel="stylesheet" href="stylesup.css">
    <!-- Load TensorFlow.js (TF.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <!-- Load Teachable Machine Library -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

</head>
<body>
    
  
    <div class="containers">
        <div class="container">
            <h1>Farmlink</h1>
            <p>This website currently supports detection for rice, wheat, maize, and more.</p>
            
            <!-- Upload Image Section with Drag & Drop Feature -->
            <center>
                <div class="upload-section" id="upload-area">
                    <label for="imageUpload" class="upload-btn" id="uploadLabel">UPLOAD IMAGE</label>
                    <input type="file" id="imageUpload" accept="image/*" onchange="handleUpload()" hidden>
                    <div id="uploadAnimation"></div>
                    <img id="previewImage" src="" alt="Uploaded Image" style="display:none; max-width: 100%; margin-top: 10px;">
                    <p class="drag-drop-text">Or drag and drop an image here</p>
                </div>
            </center>
            <button onclick="initWebcam()">Start Webcam</button>
            <button onclick="predictWebcam()">Predict Webcam</button>
            <br><br>
            <!-- Submit Button with Animation -->
            <button class="submit-btn" onclick="predictUpload()">SUBMIT</button>
            <div id="webcam-container"></div>
            <div id="label-container"></div>
            
            <div id="result"></div>
        </div>
    </div>
    <script>
        // Handle image upload and preview display
        function handleUpload() {
            const fileInput = document.getElementById("imageUpload");
            const previewImage = document.getElementById("previewImage");
            const uploadAnimation = document.getElementById("uploadAnimation");
            
            if (fileInput.files.length > 0) {
                // Show image preview
                previewImage.src = window.URL.createObjectURL(fileInput.files[0]);
                previewImage.style.display = "block";
                
                // Simulate upload animation
                uploadAnimation.innerHTML = "<div class='loading'>Uploading...</div>";
                setTimeout(() => uploadAnimation.innerHTML = "Uploaded Successfully!", 2000);
            }
        }

        const URL = "https://teachablemachine.withgoogle.com/models/fpsv1H4Qb/"; // Replace with your actual model URL
        let model, webcam, labelContainer, maxPredictions, uploadedImage;

        // Load the model automatically on page load
        async function loadModel() {
            console.log("Loading Model...");
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            labelContainer = document.getElementById("label-container");
            console.log("Model loaded successfully!");
        }

        async function initWebcam() {
            console.log("Initializing Webcam...");
            const flip = true;
            webcam = new tmImage.Webcam(200, 200, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);
            document.getElementById("webcam-container").appendChild(webcam.canvas);
        }

        async function loop() {
            if (webcam) {
                webcam.update();
                window.requestAnimationFrame(loop);
            }
        }

        async function predictWebcam() {
            if (!model || !webcam) {
                console.error("Model or webcam not initialized!");
                return;
            }
            const prediction = await model.predict(webcam.canvas);
            displayResults(prediction);
        }

        // Handle File Upload
        document.getElementById("imageUpload").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage = new Image();
                    uploadedImage.src = e.target.result;
                    uploadedImage.onload = function() {
                        document.getElementById("uploadedImage").src = uploadedImage.src;
                        document.getElementById("uploadedImage").style.display = "block";
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        async function predictUpload() {
            if (!model || !uploadedImage) {
                console.error("Model or image not initialized!");
                return;
            }
            const prediction = await model.predict(uploadedImage);
            displayResults(prediction);
        }

        function displayResults(prediction) {
            labelContainer.innerHTML = ""; // Clear previous results
            for (let i = 0; i < maxPredictions; i++) {
                const result = document.createElement("div");
                result.innerHTML = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.appendChild(result);
            }
        }

        // Load model on page load
        window.onload = loadModel;
    </script>
</body>
