<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Classification</title>
    <link rel="stylesheet" href="stylesup.css">
    
    <!-- Load TensorFlow.js for ML model execution -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    
    <!-- Load Teachable Machine image library -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div class="containers">
        <div class="container">
            <h1>Farmlink</h1>
            <p>This website currently supports detection for rice, wheat, maize, and more.</p>
            
            <!-- Buttons to control webcam and prediction -->
            <button onclick="initWebcam()">Start Webcam</button>
            <button onclick="switchCamera()">Switch Camera</button>
            <button onclick="predictWebcam()">Predict Webcam</button>
            <br><br>
            
            <!-- Containers for webcam feed and result labels -->
            <div id="webcam-container"></div>
            <div id="label-container"></div>
        </div>
    </div>
    <script>
        // URL of the trained Teachable Machine model
        const URL = "https://teachablemachine.withgoogle.com/models/fpsv1H4Qb/";
        let model, webcam, labelContainer, maxPredictions, currentFacingMode = "user"; // Default to front camera

        // Load the ML model on page load
        async function loadModel() {
            console.log("Loading Model...");
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            labelContainer = document.getElementById("label-container");
            console.log("Model loaded successfully!");
        }

        // Initialize webcam feed
        async function initWebcam() {
            console.log("Initializing Webcam...");
            if (webcam) webcam.stop(); // Stop any existing webcam feed
            webcam = new tmImage.Webcam(200, 200, currentFacingMode); // Set camera mode
            await webcam.setup(); // Request camera permissions
            await webcam.play(); // Start webcam feed
            window.requestAnimationFrame(loop);
            
            // Clear previous webcam feed and attach new feed
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
        }

        // Switch between front and back camera on mobile devices
        function switchCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            initWebcam(); // Restart webcam with new camera mode
        }

        // Continuously update webcam feed
        async function loop() {
            if (webcam) {
                webcam.update();
                window.requestAnimationFrame(loop);
            }
        }

        // Capture webcam image and make a prediction using the model
        async function predictWebcam() {
            if (!model || !webcam) {
                console.error("Model or webcam not initialized!");
                return;
            }
            const prediction = await model.predict(webcam.canvas);
            displayResults(prediction);
        }

        // Display classification results
        function displayResults(prediction) {
            labelContainer.innerHTML = ""; // Clear previous results
            for (let i = 0; i < maxPredictions; i++) {
                const result = document.createElement("div");
                result.innerHTML = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.appendChild(result);
            }
        }

        // Load the model when the page loads
        window.onload = loadModel;
    </script>
</body>
</html>
