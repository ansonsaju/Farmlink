<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <style>
        body {
            background-image: url('Beige Brown Minimalist Candle Store Website Desktop Prototype_20250303_090326_0000.svg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh; /* Allows content to grow */
            overflow: auto; /* Enables scrolling */
        }
        
        html {
            overflow: auto; /* Ensure scrolling is enabled */
        }
        
        /* Navigation Bar */
        .nav-links {
            text-align: right;
            padding: 20px;
        }

        .nav-links a {
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
            color: rgb(27, 26, 24);
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: rgb(248, 244, 239);
        }
        
        /* Responsive Design */
        @media screen and (max-width: 1024px) {
            .nav-links {
                text-align: center;
            }
        }
        
        @media screen and (max-width: 768px) {
            .nav-links a {
                font-size: 16px;
                margin: 0 10px;
            }
            body {
                overflow: auto !important; /* Ensure scrolling is allowed */
            }
        }
        
        @media screen and (max-width: 480px) {
            .nav-links {
                padding: 10px;
            }
            .nav-links a {
                font-size: 14px;
                margin: 0 5px;
            }
            body {
                overflow: auto !important; /* Fix scrolling issue on mobile */
            }
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="home.html">HOME</a>
        <a href="about.html">ABOUT</a>
    </div>
    
    <footer>
        <br><br><br><br>
        <p>&copy; <span id="year"></span> Farmlink</p>
    </footer>
    
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
